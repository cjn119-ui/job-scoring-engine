name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q
      - name: Offline demo runs end to end
        run: |
          python fixtures/make_fixtures.py
          job-scoring run --boards config/boards.example.json --fixtures fixtures --now 2026-10-28T12:00:00Z --out out/report.md
          test -s out/report.md
